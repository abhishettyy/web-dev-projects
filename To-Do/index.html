<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep a track on your schedule</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div id="outer">
        <h1>Your To-Do list</h3>
        <input placeholder="What are you doing today" type="text" id="input">
        <div id="buttons" style="margin-top: 10px;"><div class="button">Add</div><div class="clear">Clear</div></div>
        <div id="content"></div>
    </div>
    <script src="app.js"></script>
    
</body>
</html>
